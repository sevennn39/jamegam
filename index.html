<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Rooted!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rooted!</h1>
    <h2>You are an evil bug, and the trees look delicious today.</h2>
    <div>
    </div>
    <canvas id="myCanvas" width="960" height="640"></canvas>
    <script>

var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");
    var gameScale = 2;
    var gameWidth = canvas.width / gameScale;
    var gameHeight = canvas.height / gameScale;
    ctx.scale(gameScale, gameScale);
    var ballRadius = 10;
    var paddleHeight = 45;
    var paddleWidth = 75;
    var brickHeight = 51;
    var brickWidth = 75;
    var x = gameWidth/2;
    var y = gameHeight - paddleHeight - ballRadius - 1;
    var dx = 1.5;
    var dy = -1.5;
    var paddleX = (gameWidth-paddleWidth)/2;
    var rightPressed = false;
    var leftPressed = false;
    var gameStarted = false;
    var brickRowCount = 5;
    var brickColumnCount = 3;
    var brickPadding = 10;
    var brickOffsetTop = 30;
    var brickOffsetLeft = 30;
    let score = 0;

    var bricks = [];
    for(var c=0; c<brickColumnCount; c++) {
        bricks[c] = [];
        for(var r=0; r<brickRowCount; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
    }

    const blockImage = new Image();
    blockImage.src = "blockart.png";

    const ballImage = new Image();
    ballImage.src = "ballart.png";

    const paddleImage = new Image();
    paddleImage.src = "paddleart.png";

    const backgroundImage = new Image();
    backgroundImage.src = "bgart.png";

    document.addEventListener("keydown", keyDownHandler, false);
    document.addEventListener("keyup", keyUpHandler, false);
    document.addEventListener("mousemove", mouseMoveHandler);

    function mouseMoveHandler(e) {
    const bounds = canvas.getBoundingClientRect();
    const relativeX = (e.clientX - bounds.left) * gameWidth / bounds.width;
    if (relativeX > 0 && relativeX < gameWidth) {
    paddleX = relativeX - paddleWidth / 2;
  }
}

    function keyDownHandler(e) {
        if(e.code  == "ArrowRight") {
            gameStarted = true;
            rightPressed = true;
        }
        else if(e.code == 'ArrowLeft') {
            gameStarted = true;
            leftPressed = true;
        }
    }
    function keyUpHandler(e) {
        if(e.code  == "ArrowRight") {
            rightPressed = false;
        }
        else if(e.code == 'ArrowLeft') {
            leftPressed = false;
        }
    }
    
    function collisionDetection() {

  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      const b = bricks[c][r];
      if (b.status === 1) {
        if (
          x > b.x &&
          x < b.x + brickWidth &&
          y > b.y &&
          y < b.y + brickHeight
        ) {
          dy = -dy;
          b.status = 0;
          score++;
          if (score === brickRowCount * brickColumnCount) {
            alert("YOU WIN, CONGRATULATIONS! THE CROPS WILL NOT SURVIVE THE WINTER.");
            document.location.reload();
            clearInterval(interval); // Needed for Chrome to end game
          }
        }
      }
    }
  }
}

    function drawScore() {
  ctx.font = "16px Arial";
  ctx.fillStyle = "#0095DD";
  ctx.fillText(`Score: ${score}`, 8, 20);
}

    function drawBall() {
    ctx.drawImage(
        ballImage,
        x - ballRadius,
        y - ballRadius * (284 / 303),
        ballRadius * 2,
        ballRadius * 2 * (284 / 303)
    );
}

    function drawPaddle() {
    ctx.drawImage(
        paddleImage,
        paddleX,
        gameHeight - paddleHeight,
        paddleWidth,
        paddleHeight
    );
}

    function drawBackground() {
        if (!backgroundImage.complete || !backgroundImage.naturalWidth) return;

        const scale = Math.max(
            gameWidth / backgroundImage.naturalWidth,
            gameHeight / backgroundImage.naturalHeight
        );
        const width = backgroundImage.naturalWidth * scale;
        const height = backgroundImage.naturalHeight * scale;
        ctx.drawImage(
            backgroundImage,
            (gameWidth - width) / 2,
            (gameHeight - height) / 2,
            width,
            height
        );
    }

    drawScore();


    function drawBricks() {
        for(var c=0; c<brickColumnCount; c++) {
            for(var r=0; r<brickRowCount; r++) {
                if(bricks[c][r].status == 1) {
                    var brickX = (r*(brickWidth+brickPadding))+brickOffsetLeft;
                    var brickY = (c*(brickHeight+brickPadding))+brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.drawImage(blockImage, brickX, brickY, brickWidth, brickHeight);
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, gameWidth, gameHeight);
        drawBackground();
        drawBricks();
        drawBall();
        drawPaddle();
        drawScore();

        if (!gameStarted) {
            ctx.font = "16px Arial";
            ctx.fillStyle = "black";
            ctx.fillText("Press a left or right arrow key to start! :D", 90, 205);
            return;
        }

        collisionDetection();

        if(x + dx > gameWidth-ballRadius || x + dx < ballRadius) {
            dx = -dx;
        }
        if(y + dy < ballRadius) {
            dy = -dy;
        }
        else if(dy > 0 && y + dy > gameHeight - paddleHeight - ballRadius) {
            if(x > paddleX && x < paddleX + paddleWidth) {
                dy = -dy;
            }
        }
        if(dy > 0 && y + dy > gameHeight - ballRadius) {
            alert("YOU LOSE! You lose... you lose... (bluey ref)");
            document.location.reload();
        }

        if(rightPressed && paddleX < gameWidth-paddleWidth) {
            paddleX += 7;
        }
        else if(leftPressed && paddleX > 0) {
            paddleX -= 7;
        }

        x += dx;
        y += dy;
    }

    setInterval(draw, 10);

    </script>
</body>
</html>

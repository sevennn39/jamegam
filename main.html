<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Rooted!</title>
    <ref = "stylesheet" href = "style.css"></ref>
</head>
<body>
    <h1>Rooted!</h1>
    <h2>You are an evil bug, and the trees look delicious today.</h2>
    <div>
    </div>
    <canvas id="EVILCANVAS" width="480" height="320"></canvas>
    <script>
        const canvas = document.getElementById("EVILCANVAS");
        const ctx = canvas.getContext("2d")
        ctx.beginPath();
        ctx.rect(20,40,50,50);
        ctx.fillStyle = "brown";
        ctx.fill();
        ctx.closePath();

        ctx.beginPath();
        ctx.arc(240,160,20,0, Math.PI*2, false);
        ctx.fillStyle = "black";
        ctx.fill();
        ctx.closePath();

        ctx.beginPath();
        ctx.rect(160,10,100,40);
        ctx.strokeStyle = "rgb(0 0 255 / 50%)";
        ctx.stroke();
        ctx.closePath();

    </script>
</body>
</html>
